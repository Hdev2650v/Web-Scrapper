name: IGNOU Scraper Bot

on:
  schedule:
    # This translates to 10:00 AM IST every day
    - cron: "30 4 * * *" 
  workflow_dispatch: # This adds a manual "Run" button for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This gives the bot permission to save the JSON file
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        # Running your specific file
        run: python Scrapper.py

      - name: Save memory (Commit seen_links.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen links memory"
          git push
